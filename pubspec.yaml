name: job_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_riverpod: ^3.2.0
  go_router: ^17.0.1
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  
  # UI & Utils
  google_fonts: ^8.0.0
  intl: ^0.20.2
  url_launcher: ^6.2.0
  file_picker: ^10.3.10
  google_sign_in: ^6.2.0
  http: ^1.6.0
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
